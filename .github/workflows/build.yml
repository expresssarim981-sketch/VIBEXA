
name: VIBEXA APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build VIBEXA Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter Project
        run: flutter create --org com.zyvoraq --project-name vibexa vibexa

      - name: Install Supabase Package
        working-directory: vibexa
        run: flutter pub add supabase_flutter

      - name: Configure VIBEXA App
        working-directory: vibexa
        run: |
          cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'package:supabase_flutter/supabase_flutter.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();

            const supabaseUrl = String.fromEnvironment('SUPABASE_URL');
            const supabaseKey = String.fromEnvironment('SUPABASE_ANON_KEY');

            if (supabaseUrl.isNotEmpty && supabaseKey.isNotEmpty) {
              await Supabase.initialize(
                url: supabaseUrl,
                anonKey: supabaseKey,
              );
            }

            runApp(const VibexaApp());
          }

          class VibexaApp extends StatelessWidget {
            const VibexaApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'VIBEXA',
                theme: ThemeData.dark(),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatelessWidget {
            const HomeScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF101020),
                body: Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      const Text(
                        'VIBEXA',
                        style: TextStyle(
                          fontSize: 42,
                          fontWeight: FontWeight.bold,
                          color: Colors.purpleAccent,
                        ),
                      ),
                      const SizedBox(height: 12),
                      const Text('Connect the World'),
                      const SizedBox(height: 25),
                      Text(
                        const String.fromEnvironment('SUPABASE_URL').isNotEmpty
                            ? 'Supabase configured'
                            : 'Supabase not configured',
                        style: const TextStyle(color: Colors.greenAccent),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Build Release APK
        working-directory: vibexa
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIBEXA-APK
          path: vibexa/build/app/outputs/flutter-apk/app-release.apk
