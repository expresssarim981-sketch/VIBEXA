
name: Build VIBEXA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter Project
        run: |
          flutter create vibexa_build
          cd vibexa_build

      - name: Build VIBEXA App
        run: |
          cd vibexa_build
          cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';

          void main() {
            runApp(const VibexaApp());
          }

          const purple = Color(0xFF8B5CF6);
          const dark = Color(0xFF100D1F);

          class VibexaApp extends StatelessWidget {
            const VibexaApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: dark,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: purple,
                    brightness: Brightness.dark,
                  ),
                ),
                home: const LoginScreen(),
              );
            }
          }

          class LoginScreen extends StatefulWidget {
            const LoginScreen({super.key});

            @override
            State<LoginScreen> createState() => _LoginScreenState();
          }

          class _LoginScreenState extends State<LoginScreen> {
            final phone = TextEditingController();
            final name = TextEditingController();
            final age = TextEditingController();

            bool signup = false;
            String gender = 'Male';

            Widget field(
              String label,
              TextEditingController controller,
              IconData icon, {
              TextInputType keyboard = TextInputType.text,
            }) {
              return Padding(
                padding: const EdgeInsets.only(bottom: 16),
                child: TextField(
                  controller: controller,
                  keyboardType: keyboard,
                  style: const TextStyle(color: Colors.white),
                  decoration: InputDecoration(
                    labelText: label,
                    prefixIcon: Icon(icon, color: purple),
                    filled: true,
                    fillColor: const Color(0xFF211B32),
                    border: OutlineInputBorder(
                      borderRadius: BorderRadius.circular(16),
                      borderSide: BorderSide.none,
                    ),
                  ),
                ),
              );
            }

            void next() {
              if (phone.text.trim().length < 10) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('Enter your mobile number')),
                );
                return;
              }

              if (!signup) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text('Demo OTP: 123456'),
                  ),
                );

                setState(() => signup = true);
              } else {
                if (name.text.trim().isEmpty ||
                    age.text.trim().isEmpty) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(
                      content: Text('Complete your profile'),
                    ),
                  );
                  return;
                }

                Navigator.pushReplacement(
                  context,
                  MaterialPageRoute(
                    builder: (_) => HomeScreen(
                      username: name.text,
                    ),
                  ),
                );
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.all(24),
                    child: Column(
                      children: [
                        const SizedBox(height: 50),

                        Container(
                          height: 100,
                          width: 100,
                          decoration: BoxDecoration(
                            gradient: const LinearGradient(
                              colors: [
                                purple,
                                Color(0xFFEC4899),
                              ],
                            ),
                            borderRadius: BorderRadius.circular(30),
                          ),
                          child: const Icon(
                            Icons.mic,
                            size: 55,
                            color: Colors.white,
                          ),
                        ),

                        const SizedBox(height: 20),

                        const Text(
                          'VIBEXA',
                          style: TextStyle(
                            fontSize: 36,
                            fontWeight: FontWeight.bold,
                            letterSpacing: 5,
                          ),
                        ),

                        const Text(
                          'Connect • Talk • Party',
                          style: TextStyle(
                            color: Colors.white54,
                            fontSize: 16,
                          ),
                        ),

                        const SizedBox(height: 45),

                        Text(
                          signup ? 'Create Your Profile' : 'Welcome to VIBEXA',
                          style: const TextStyle(
                            fontSize: 25,
                            fontWeight: FontWeight.bold,
                          ),
                        ),

                        const SizedBox(height: 10),

                        Text(
                          signup
                              ? 'Tell us about yourself'
                              : 'Enter your mobile number to continue',
                          style: const TextStyle(
                            color: Colors.white60,
                          ),
                        ),

                        const SizedBox(height: 30),

                        field(
                          'Mobile Number',
                          phone,
                          Icons.phone_android,
                          keyboard: TextInputType.phone,
                        ),

                        if (signup) ...[
                          field(
                            'Your Name',
                            name,
                            Icons.person,
                          ),

                          field(
                            'Age',
                            age,
                            Icons.cake,
                            keyboard: TextInputType.number,
                          ),

                          const SizedBox(height: 10),

                          const Align(
                            alignment: Alignment.centerLeft,
                            child: Text('Gender'),
                          ),

                          const SizedBox(height: 10),

                          Row(
                            children: [
                              Expanded(
                                child: RadioListTile<String>(
                                  value: 'Male',
                                  groupValue: gender,
                                  onChanged: (v) {
                                    setState(() => gender = v!);
                                  },
                                  title: const Text('Male'),
                                  activeColor: purple,
                                ),
                              ),
                              Expanded(
                                child: RadioListTile<String>(
                                  value: 'Female',
                                  groupValue: gender,
                                  onChanged: (v) {
                                    setState(() => gender = v!);
                                  },
                                  title: const Text('Female'),
                                  activeColor: purple,
                                ),
                              ),
                            ],
                          ),
                        ],

                        const SizedBox(height: 25),

                        SizedBox(
                          width: double.infinity,
                          height: 55,
                          child: ElevatedButton(
                            onPressed: next,
                            style: ElevatedButton.styleFrom(
                              backgroundColor: purple,
                              foregroundColor: Colors.white,
                              shape: RoundedRectangleBorder(
                                borderRadius: BorderRadius.circular(16),
                              ),
                            ),
                            child: Text(
                              signup ? 'CREATE ACCOUNT' : 'CONTINUE',
                              style: const TextStyle(
                                fontWeight: FontWeight.bold,
                                fontSize: 16,
                              ),
                            ),
                          ),
                        ),

                        const SizedBox(height: 25),

                        const Text(
                          'By continuing, you agree to our Terms & Privacy Policy',
                          textAlign: TextAlign.center,
                          style: TextStyle(
                            fontSize: 12,
                            color: Colors.white38,
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class HomeScreen extends StatelessWidget {
            final String username;

            const HomeScreen({
              super.key,
              required this.username,
            });

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: dark,
                  title: const Text(
                    'VIBEXA',
                    style: TextStyle(
                      fontWeight: FontWeight.bold,
                      letterSpacing: 3,
                    ),
                  ),
                  actions: const [
                    Padding(
                      padding: EdgeInsets.all(16),
                      child: Icon(Icons.monetization_on, color: Colors.amber),
                    ),
                  ],
                ),
                body: ListView(
                  padding: const EdgeInsets.all(20),
                  children: [
                    Text(
                      'Welcome, $username 👋',
                      style: const TextStyle(
                        fontSize: 24,
                        fontWeight: FontWeight.bold,
                      ),
                    ),

                    const SizedBox(height: 25),

                    const Text(
                      'Explore VIBEXA',
                      style: TextStyle(
                        fontSize: 22,
                        fontWeight: FontWeight.bold,
                      ),
                    ),

                    const SizedBox(height: 20),

                    Wrap(
                      spacing: 12,
                      runSpacing: 12,
                      children: [
                        category('🎙️', 'Voice'),
                        category('🎵', 'Music'),
                        category('💬', 'Chat'),
                        category('🎮', 'Games'),
                      ],
                    ),

                    const SizedBox(height: 35),

                    const Text(
                      'Trending Rooms',
                      style: TextStyle(
                        fontSize: 22,
                        fontWeight: FontWeight.bold,
                      ),
                    ),

                    const SizedBox(height: 15),

                    room('🎤', 'Friends Party', '125 people'),
                    room('🎵', 'Music Lounge', '89 people'),
                    room('💜', 'Chill Zone', '64 people'),

                    const SizedBox(height: 30),

                    Container(
                      padding: const EdgeInsets.all(24),
                      decoration: BoxDecoration(
                        gradient: const LinearGradient(
                          colors: [purple, Color(0xFFEC4899)],
                        ),
                        borderRadius: BorderRadius.circular(24),
                      ),
                      child: const Column(
                        children: [
                          Icon(Icons.add_circle, size: 45),
                          SizedBox(height: 12),
                          Text(
                            'Create Your Party',
                            style: TextStyle(
                              fontSize: 22,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          Text('Start your own voice room'),
                        ],
                      ),
                    ),
                  ],
                ),
                bottomNavigationBar: BottomNavigationBar(
                  backgroundColor: const Color(0xFF211B32),
                  selectedItemColor: purple,
                  unselectedItemColor: Colors.white54,
                  type: BottomNavigationBarType.fixed,
                  items: const [
                    BottomNavigationBarItem(
                      icon: Icon(Icons.home),
                      label: 'Home',
                    ),
                    BottomNavigationBarItem(
                      icon: Icon(Icons.explore),
                      label: 'Discover',
                    ),
                    BottomNavigationBarItem(
                      icon: Icon(Icons.mic),
                      label: 'Party',
                    ),
                    BottomNavigationBarItem(
                      icon: Icon(Icons.message),
                      label: 'Messages',
                    ),
                    BottomNavigationBarItem(
                      icon: Icon(Icons.person),
                      label: 'Profile',
                    ),
                  ],
                ),
              );
            }

            Widget category(String emoji, String title) {
              return Container(
                width: 145,
                padding: const EdgeInsets.all(18),
                decoration: BoxDecoration(
                  color: const Color(0xFF211B32),
                  borderRadius: BorderRadius.circular(18),
                ),
                child: Column(
                  children: [
                    Text(emoji, style: const TextStyle(fontSize: 30)),
                    const SizedBox(height: 8),
                    Text(title),
                  ],
                ),
              );
            }

            Widget room(String emoji, String title, String people) {
              return Container(
                margin: const EdgeInsets.only(bottom: 12),
                padding: const EdgeInsets.all(18),
                decoration: BoxDecoration(
                  color: const Color(0xFF211B32),
                  borderRadius: BorderRadius.circular(18),
                ),
                child: Row(
                  children: [
                    Text(emoji, style: const TextStyle(fontSize: 30)),
                    const SizedBox(width: 15),
                    Expanded(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(
                            title,
                            style: const TextStyle(
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          Text(
                            people,
                            style: const TextStyle(
                              color: Colors.white54,
                            ),
                          ),
                        ],
                      ),
                    ),
                    const Icon(Icons.arrow_forward_ios, color: purple),
                  ],
                ),
              );
            }
          }
          EOF

          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIBEXA-APK
          path: vibexa_build/build/app/outputs/flutter-apk/app-release.apk
