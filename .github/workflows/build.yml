Widget title(String text) {
  return Text(
    text,
    style: const TextStyle(
      fontSize: 20,
      fontWeight: FontWeight.bold,
    ),
  );
}

Widget category(IconData icon, String text) {
  return Expanded(
    child: Column(
      children: [
        Container(
          height: 58,
          width: 58,
          decoration: BoxDecoration(
            color: card,
            borderRadius: BorderRadius.circular(18),
          ),
          child: Icon(icon, color: purple, size: 27),
        ),
        const SizedBox(height: 8),
        Text(text, style: const TextStyle(fontSize: 12)),
      ],
    ),
  );
}

Widget room(String emoji, String name, String subtitle) {
  return Container(
    margin: const EdgeInsets.only(bottom: 12),
    padding: const EdgeInsets.all(15),
    decoration: BoxDecoration(
      color: card,
      borderRadius: BorderRadius.circular(18),
    ),
    child: Row(
      children: [
        CircleAvatar(
          radius: 27,
          backgroundColor: purple.withOpacity(0.2),
          child: Text(emoji, style: const TextStyle(fontSize: 25)),
        ),
        const SizedBox(width: 13),
        Expanded(
          child: Column(
            crossAxisAlignment: CrossAxisAlignment.start,
            children: [
              Text(
                name,
                style: const TextStyle(fontWeight: FontWeight.bold),
              ),
              const SizedBox(height: 5),
              Text(
                subtitle,
                style: const TextStyle(color: Colors.white60),
              ),
            ],
          ),
        ),
        const Icon(Icons.arrow_forward_ios, color: purple, size: 16),
      ],
    ),
  );
}

Widget feature(IconData icon, String name, String subtitle) {
  return Container(
    margin: const EdgeInsets.only(bottom: 12),
    padding: const EdgeInsets.all(17),
    decoration: BoxDecoration(
      color: card,
      borderRadius: BorderRadius.circular(18),
    ),
    child: Row(
      children: [
        Icon(icon, color: purple, size: 30),
        const SizedBox(width: 15),
        Expanded(
          child: Column(
            crossAxisAlignment: CrossAxisAlignment.start,
            children: [
              Text(
                name,
                style: const TextStyle(fontWeight: FontWeight.bold),
              ),
              const SizedBox(height: 5),
              Text(
                subtitle,
                style: const TextStyle(color: Colors.white60),
              ),
            ],
          ),
        ),
        const Icon(Icons.arrow_forward_ios, size: 15),
      ],
    ),
  );
}

Widget stat(String name, String value) {
  return Expanded(
    child: Container(
      margin: const EdgeInsets.symmetric(horizontal: 4),
      padding: const EdgeInsets.all(15),
      decoration: BoxDecoration(
        color: card,
        borderRadius: BorderRadius.circular(15),
      ),
      child: Column(
        children: [
          Text(
            value,
            style: const TextStyle(
              fontSize: 20,
              fontWeight: FontWeight.bold,
            ),
          ),
          const SizedBox(height: 5),
          Text(
            name,
            style: const TextStyle(
              color: Colors.white60,
              fontSize: 11,
            ),
          ),
        ],
      ),
    ),
  );
}
EOF

      - name: Build APK
        run: |
          cd vibexa_build
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIBEXA-APK
          path: vibexa_build/build/app/outputs/flutter-apk/app-release.apk
